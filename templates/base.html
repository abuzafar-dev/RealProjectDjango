<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url('post_list') }}">Blog</a>
        <div class="d-flex align-items-center gap-2">
            {% if request.user.is_authenticated %}
                <a class="btn btn-sm btn-success" href="{{ url('post_create') }}">+ Yangi post</a>
                <a class="btn btn-sm btn-outline-light" href="{{ url('my_posts') }}">Mening postlarim</a>
                <span class="text-white-50">{{ request.user.username }}</span>
                <form method="post" action="{{ url('logout') }}" class="m-0">
                    {{ csrf_input }}
                    <button class="btn btn-sm btn-outline-danger" type="submit">Chiqish</button>
                </form>
            {% else %}
                <a class="btn btn-sm btn-outline-light" href="{{ url('login') }}">Kirish</a>
                <a class="btn btn-sm btn-primary" href="{{ url('register') }}">Ro'yxatdan o'tish</a>
            {% endif %}
        </div>
    </div>
</nav>
<main class="container">
    {% for message in get_messages(request) %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
